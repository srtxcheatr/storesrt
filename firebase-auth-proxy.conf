# src by SRT X CHEATS. Copy right SRT X CHEATS
# Reverse-proxy Firebase Auth helper pages through our own domain.
# Set FIREBASE_AUTH_DOMAIN=www.srtxcheats.com on Render (frontend service).
# If your Firebase project id is not "bronzx", change both lines below.
SSLProxyEngine On
SSLProxyCheckPeerName On
SSLProxyCheckPeerCN On

ProxyPreserveHost Off
ProxyPass        /__/auth/     https://bronzx.firebaseapp.com/__/auth/
ProxyPassReverse /__/auth/     https://bronzx.firebaseapp.com/__/auth/
ProxyPass        /__/firebase/ https://bronzx.firebaseapp.com/__/firebase/
ProxyPassReverse /__/firebase/ https://bronzx.firebaseapp.com/__/firebase/
